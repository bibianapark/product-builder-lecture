<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제휴 문의</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #eef1f6;
    --muted: #9aa3b2;
    --accent: #7c9cff;
    --row-bg: rgba(255,255,255,0.04);
    --shadow: rgba(0,0,0,0.4);
    --border: rgba(255,255,255,0.08);
  }
  :root[data-theme="light"] {
    --bg: #f2f3f7;
    --card: #ffffff;
    --text: #1a1d24;
    --muted: #6b7280;
    --accent: #4b6fe0;
    --row-bg: rgba(0,0,0,0.04);
    --shadow: rgba(0,0,0,0.12);
    --border: rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    transition: background 0.25s, color 0.25s;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: var(--card);
    border-radius: 20px;
    padding: 48px 36px;
    box-shadow: 0 20px 60px var(--shadow);
    transition: background 0.25s, box-shadow 0.25s;
  }
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .theme-toggle {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: none;
    border-radius: 10px;
    background: var(--row-bg);
    font-size: 18px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
  }
  .theme-toggle:hover { filter: brightness(1.15); }
  .theme-toggle:active { transform: scale(0.92); }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14.5px; margin-bottom: 28px; }

  form { display: flex; flex-direction: column; gap: 16px; }
  label { font-size: 13.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
  input, textarea {
    width: 100%;
    background: var(--row-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14.5px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 110px; }

  button[type="submit"] {
    background: linear-gradient(135deg, var(--accent), #4b6fe0);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
    margin-top: 4px;
  }
  button[type="submit"]:hover { filter: brightness(1.1); }
  button[type="submit"]:active { transform: scale(0.97); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

  .status {
    font-size: 14px;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: rgba(80, 200, 120, 0.12); color: #4fbf7a; }
  .status.err { background: rgba(255, 90, 90, 0.12); color: #ff7272; }

  footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h1>🤝 제휴 문의</h1>
        <div class="sub">제휴 및 협업 제안을 남겨주시면 빠르게 확인하겠습니다</div>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="다크/화이트 모드 전환" title="다크/화이트 모드 전환">🌙</button>
    </div>

    <form id="partnerForm">
      <div>
        <label for="name">이름 / 담당자명</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="company">회사 / 기관명</label>
        <input type="text" id="company" name="company">
      </div>
      <div>
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" placeholder="제휴 제안 내용을 자유롭게 작성해주세요" required></textarea>
      </div>
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <button type="submit" id="submitBtn">문의 보내기</button>
      <div class="status" id="status"></div>
    </form>

    <footer>남겨주신 이메일로 답변 드립니다. &middot; <a href="index.html">← 로또 추천기로 돌아가기</a></footer>
  </div>

<script>
  const rootEl = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');

  function applyTheme(theme) {
    rootEl.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
  }

  let savedTheme = null;
  try { savedTheme = localStorage.getItem('lotto-theme'); } catch (e) {}

  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(savedTheme || (prefersLight ? 'light' : 'dark'));

  themeToggle.addEventListener('click', () => {
    const next = rootEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('lotto-theme', next); } catch (e) {}
  });

  const form = document.getElementById('partnerForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '전송 중...';
    statusEl.className = 'status';

    try {
      const res = await fetch('https://formspree.io/f/xppdrnjk', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      });

      if (res.ok) {
        statusEl.textContent = '문의가 정상적으로 전송되었습니다. 감사합니다!';
        statusEl.className = 'status show ok';
        form.reset();
      } else {
        statusEl.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해주세요.';
        statusEl.className = 'status show err';
      }
    } catch (err) {
      statusEl.textContent = '전송 중 오류가 발생했습니다. 네트워크를 확인해주세요.';
      statusEl.className = 'status show err';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '문의 보내기';
    }
  });
</script>
</body>
</html>
