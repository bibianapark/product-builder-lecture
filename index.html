<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 추천기</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #eef1f6;
    --muted: #9aa3b2;
    --accent: #7c9cff;
    --row-bg: rgba(255,255,255,0.04);
    --shadow: rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    --bg: #f2f3f7;
    --card: #ffffff;
    --text: #1a1d24;
    --muted: #6b7280;
    --accent: #4b6fe0;
    --row-bg: rgba(0,0,0,0.04);
    --shadow: rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    transition: background 0.25s, color 0.25s;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: var(--card);
    border-radius: 20px;
    padding: 48px 36px;
    box-shadow: 0 20px 60px var(--shadow);
    transition: background 0.25s, box-shadow 0.25s;
  }
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .theme-toggle {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: none;
    border-radius: 10px;
    background: var(--row-bg);
    font-size: 18px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
  }
  .theme-toggle:hover { filter: brightness(1.15); }
  .theme-toggle:active { transform: scale(0.92); }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14.5px; margin-bottom: 28px; }

  .controls { display: flex; gap: 10px; margin-bottom: 28px; align-items: center; }
  select {
    background: #eef1f6;
    color: #1a1a1a;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
  }
  button {
    background: linear-gradient(135deg, var(--accent), #4b6fe0);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.97); }

  .results { display: flex; flex-direction: column; gap: 12px; min-height: 60px; }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--row-bg);
    border-radius: 12px;
    padding: 10px 12px;
    opacity: 0;
    animation: fadeIn 0.35s forwards;
  }
  .row .idx { color: var(--muted); font-size: 12.5px; width: 20px; }
  .ball {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
    flex-shrink: 0;
  }
  .b1 { background: #fbc400; }
  .b2 { background: #69c8f2; }
  .b3 { background: #ff7272; }
  .b4 { background: #aaaaaa; color: #fff; }
  .b5 { background: #b0d840; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h1>🎱 로또 번호 추천기</h1>
        <div class="sub">1~45 중 중복 없이 6개 번호를 무작위로 추천해드려요</div>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="다크/화이트 모드 전환" title="다크/화이트 모드 전환">🌙</button>
    </div>

    <div class="controls">
      <select id="count">
        <option value="1">1게임</option>
        <option value="3">3게임</option>
        <option value="5" selected>5게임</option>
      </select>
      <button id="generateBtn">번호 추천받기</button>
    </div>

    <div class="results" id="results">
      <div class="empty">버튼을 눌러 번호를 추천받아 보세요</div>
    </div>

    <footer>※ 추천 번호는 무작위 생성이며 당첨을 보장하지 않습니다.</footer>
  </div>

<script>
  const rootEl = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');

  function applyTheme(theme) {
    rootEl.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
  }

  let savedTheme = null;
  try { savedTheme = localStorage.getItem('lotto-theme'); } catch (e) {}

  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(savedTheme || (prefersLight ? 'light' : 'dark'));

  themeToggle.addEventListener('click', () => {
    const next = rootEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('lotto-theme', next); } catch (e) {}
  });

  function ballClass(n) {
    if (n <= 10) return 'b1';
    if (n <= 20) return 'b2';
    if (n <= 30) return 'b3';
    if (n <= 40) return 'b4';
    return 'b5';
  }

  function generateOneSet() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    const picked = [];
    for (let i = 0; i < 6; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    return picked.sort((a, b) => a - b);
  }

  document.getElementById('generateBtn').addEventListener('click', () => {
    const count = parseInt(document.getElementById('count').value, 10);
    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = '';

    for (let g = 0; g < count; g++) {
      const numbers = generateOneSet();
      const row = document.createElement('div');
      row.className = 'row';
      row.style.animationDelay = (g * 0.08) + 's';

      const idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = (g + 1) + '게임';
      row.appendChild(idx);

      numbers.forEach(n => {
        const ball = document.createElement('div');
        ball.className = 'ball ' + ballClass(n);
        ball.textContent = n;
        row.appendChild(ball);
      });

      resultsEl.appendChild(row);
    }
  });
</script>
</body>
</html>
